[project]
name = "fastapi-beyond-crud"
version = "0.1.0"
description = "FastAPI beyond CRUD - advanced features demo"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.13.1",
    "asgiref==3.8.1",
    "asyncpg==0.29.0",
    "bcrypt==4.0.1",
    "celery==5.4.0",
    "fastapi==0.111.0",
    "fastapi-cli>=0.0.32",
    "fastapi-mail==1.4.1",
    "flower==2.0.1",
    "greenlet==3.0.3",
    "httpx==0.27.0",
    "itsdangerous==2.2.0",
    "passlib==1.7.4",
    "psycopg2-binary==2.9.9",
    "pydantic-settings==2.4.0",
    "pyjwt==2.8.0",
    "redis==5.0.7",
    "sqlmodel==0.0.18",
]

[project.scripts]
fastapi = "fastapi_cli.cli:main"

[dependency-groups]
dev = [
    "isort==5.13.2",
    "ruff==0.4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
